recipe_version: "3"
name: GLM-5.3-Flash-FP8-TP4-MTP3-GB10
model: unsloth/GLM-5.3-Flash-FP8
container: glm53-vllm-gb10:nope-sm121-topk-compact-v2-kda-hostmeta
runtime: vllm
cluster_only: true
solo_only: false
min_nodes: 4

defaults:
  model: unsloth/GLM-5.3-Flash-FP8
  revision: a160e2291674d9e3e92e98fd82faa2544a2867a3
  served_model_name: glm-5.3-flash-fp8
  host: 0.0.0.0
  port: 8000
  tensor_parallel: 4
  nnodes: 4
  master_addr: 10.0.0.46
  master_port: 29500
  gpu_memory_utilization: 0.82
  max_model_len: 262144
  validated_context: 65535
  validated_concurrency: 10
  max_num_batched_tokens: 8192
  max_num_seqs: 4
  kv_cache_dtype: fp8
  num_speculative_tokens: 3
  enforce_eager: true

env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  TORCH_CUDA_ARCH_LIST: 12.1a
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  VLLM_LOGGING_LEVEL: INFO
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_NVLS_ENABLE: "0"

# scripts/glm53_native_launch.sh renders this command for each rank. Worker
# ranks add --headless; rank zero serves the API. Ray is deliberately absent.
command: |
  vllm serve {model} \
    --revision {revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --distributed-executor-backend mp \
    --nnodes {nnodes} \
    --node-rank {node_rank} \
    --master-addr {master_addr} \
    --master-port {master_port} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --kv-cache-dtype {kv_cache_dtype} \
    --enable-prefix-caching \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --enable-flashinfer-autotune \
    --enforce-eager \
    --speculative-config '{{"method":"mtp","num_speculative_tokens":{num_speculative_tokens}}}'

validation:
  status: validated-through-65k-c10
  focused_requests: 90
  focused_result_rows: 8
  focused_request_errors: 0
  unsupported:
    - context: 100000
      concurrency: 10
      reason: FLA/KDA kernel wedge with repeated broadcast starvation
    - max_num_seqs: 5
      context: 100000
      concurrency: 5
      reason: FLA/KDA kernel wedge
    - max_num_seqs: 10
      context: 100000
      concurrency: 5
      reason: FLA/KDA kernel wedge

metadata:
  architecture: Glm5NextForConditionalGeneration
  model_params: 320B-total-18B-active
  quantization: fp8-block-128x128
  kv_dtype: fp8
  checkpoint_bytes: 328337455672
  checkpoint_shards: 62
  language_only: true
  runtime_image_published: false
  notes: |
    Native TP=4 over PyTorch distributed/NCCL; no Ray. The KDA patch removes
    forward-path GPU-to-CPU chunk-index synchronization, handles mixed
    decode/prefill batches, and bypasses identity caching for mutable scheduler
    CPU metadata. Focused 65K c5/c10 validation completed 90/90 requests and
    8/8 rows. The 262K model ceiling is not a validated concurrency envelope;
    100K c10 remains unsupported on this kernel stack.

executor_config:
  user: root
